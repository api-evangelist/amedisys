description: >-
  Amedisys, Inc. is a United States home health, hospice, palliative and high-acuity in-home
  care company headquartered in Baton Rouge, Louisiana. Founded in 1982, it delivers skilled
  nursing, physical and occupational therapy, medical social work, hospice and palliative care
  through a nationwide network of care centers, and — through Contessa, an Amedisys company —
  hospital-level and skilled-nursing-level care delivered in the patient's home in partnership
  with health systems and payers. Formerly listed on Nasdaq as AMED, Amedisys was acquired by
  UnitedHealth Group's Optum in a $3.3 billion all-cash transaction that closed in August 2025
  after a Department of Justice settlement requiring the divestiture of 164 home health and
  hospice locations; it continues to operate under the Amedisys brand. Amedisys publishes no
  public API: there is no developer portal, no API reference, no OpenAPI, GraphQL, AsyncAPI,
  gRPC or SOAP contract, no SDK on any package registry, no MCP server and no A2A agent card.
  Clinical data moves between Amedisys, its referral sources, its EHR vendors and payers under
  HIPAA business-associate agreements and bilateral integration contracts rather than through a
  documented public interface.
