description: >-
  Amedisys publishes no API plans or pricing of any kind, because it publishes no API. It is a
  home health, hospice and palliative care-delivery organization (an Optum subsidiary since
  August 2025) whose revenue comes from Medicare, Medicaid, managed-care and commercial payer
  reimbursement for clinical services, not from metered software access.
notes: >-
