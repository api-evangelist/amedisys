  this artifact carried a single placeholder "Pricing Overview" plan written by the 2026-05-04
  bulk sweep; it described nothing Amedisys publishes and has been removed rather than left to
  read as a real tier. Any exchange of data with referral sources, EHR vendors or payers is
  governed by bilateral integration contracts and HIPAA business-associate agreements, which are
  not published. Reconcile only if Amedisys (or Optum under the Amedisys brand) publishes a
  public API with commercial terms.
